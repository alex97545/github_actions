name: First Workflow

on: [push]

jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: Display some text
              run: echo "Some text with second attempt"
            - name: Command in multiline
              run: |
                node -v
                npm -v
    run-parallel-command:
        runs-on: windows-latest
        steps:
            - name: Display Node Version on Ubuntu
              run: node -v
    run-second-command:
        runs-on: macos-latest
        needs: [run-first-command]
        steps: 
            - name: Display Node Version on MACOS
              run: node -v